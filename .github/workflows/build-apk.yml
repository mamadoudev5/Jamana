name: Construire APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "www/maj.json"
      - "*.txt"

permissions:
  contents: write

env:
  APP_VERSION: "1.6.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dependances
        run: npm install

      - name: Creer le projet Android
        run: npx cap add android

      - name: Permissions notifications et position
        run: |
          sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n</manifest>#" android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Generer les icones
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Fixer la version de appli
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"${APP_VERSION}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Cle de signature stable
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Copier appli dans Android
        run: npx cap sync android

      - name: Compiler APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renommer APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Jamana-v${APP_VERSION}.apk

      - name: Publier APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build${{ github.run_number }}
          name: Jamana v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          files: Jamana-v${{ env.APP_VERSION }}.apk
